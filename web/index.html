<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tech News</title>
<style>
  :root { --bg:#fafaf9; --card:#fff; --text:#1c1917; --muted:#78716c; --line:#e7e5e4; --accent:#2563eb; --star:#d97706; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#161412; --card:#1f1c1a; --text:#f5f5f4; --muted:#a8a29e; --line:#36312e; --accent:#60a5fa; --star:#fbbf24; }
  }
  :root[data-theme="dark"] { --bg:#161412; --card:#1f1c1a; --text:#f5f5f4; --muted:#a8a29e; --line:#36312e; --accent:#60a5fa; --star:#fbbf24; }
  #theme { float:right; font:inherit; font-size:1.1rem; line-height:1; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 9px; cursor:pointer; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:820px; margin:0 auto; padding:16px; }
  h1 { font-size:1.25rem; margin:8px 0 12px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  input, select { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  input { flex:1 1 200px; }
  nav { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:8px; }
  nav button { flex:none; font:inherit; font-size:.9rem; color:var(--text); background:var(--card); border:1px solid var(--line);
    border-radius:999px; padding:6px 12px; cursor:pointer; }
  nav button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  nav small { opacity:.7; margin-left:4px; }
  #days { display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:8px; scrollbar-width:thin; }
  #days button { flex:none; text-align:center; font:inherit; font-size:.8rem; line-height:1.25; color:var(--text); background:var(--card);
    border:1px solid var(--line); border-radius:10px; padding:6px 10px; min-width:58px; cursor:pointer; }
  #days button b { display:block; font-size:1rem; }
  #days button span { color:var(--muted); }
  #days button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  #days button[aria-pressed="true"] span { color:#fff; opacity:.85; }
  article { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  article a { color:var(--text); font-weight:600; text-decoration:none; }
  article a:hover, article a:focus-visible { color:var(--accent); text-decoration:underline; }
  .meta { color:var(--muted); font-size:.8rem; margin-top:4px; }
  .star { color:var(--star); }
  #sub { font-size:.8rem; font-weight:500; margin-left:10px; color:#fff; background:var(--accent); border-radius:999px; padding:4px 10px; text-decoration:none; vertical-align:middle; }
  h2 { font-size:1rem; margin:12px 0 8px; }
  #top article { border-color:var(--star); }
  p { margin:6px 0 0; font-size:.95rem; }
  .act { margin:6px 0 0; font-size:.9rem; color:var(--accent); }
  .save, #export { font:inherit; font-size:.8rem; color:var(--muted); background:none; border:1px solid var(--line); border-radius:6px; padding:2px 8px; cursor:pointer; margin-left:8px; }
  .save[aria-pressed="true"] { color:var(--star); border-color:var(--star); }
  #status { color:var(--muted); font-size:.85rem; margin:8px 0; }
</style>
</head>
<body>
<main>
  <h1><button id="theme" type="button" aria-label="Đổi giao diện sáng/tối"></button>Tech News<a id="sub" hidden target="_blank" rel="noopener noreferrer">Nhận tin qua Telegram</a></h1>
  <div class="bar">
    <input id="q" type="search" placeholder="Tìm kiếm…" aria-label="Tìm kiếm">
    <select id="sort" aria-label="Sắp xếp">
      <option value="date">Mới nhất</option><option value="sig">Quan trọng nhất</option>
    </select>
    <select id="kind" aria-label="Loại bài"><option value="">Mọi loại</option><option value="tool">Công cụ</option><option value="tutorial">Hướng dẫn</option><option value="case-study">Case study</option><option value="pricing">Giá &amp; model</option><option value="launch">Ra mắt</option><option value="news">Tin</option></select>
    <button id="export" type="button" hidden>Xuất Markdown</button>
  </div>
  <nav id="days" aria-label="Chọn ngày"></nav>
  <nav id="tabs" aria-label="Danh mục"></nav>
  <div id="status"></div>
  <section id="top" hidden><h2>★ Nổi bật trong ngày</h2><div id="topList"></div></section>
  <div id="list"></div>
</main>
<script>
const LABELS = { all:"Tất cả", "ai-agents":"AI & Agents", security:"Bảo mật", "cloud-infra":"Cloud & Infra",
  fullstack:"Fullstack", opensource:"Mã nguồn mở", "build-in-public":"Build in Public", hackathons:"Hackathon", releases:"Cập nhật công cụ", saved:"Đã lưu", general:"Khác" };
const KIND = { tool:"Công cụ", tutorial:"Hướng dẫn", "case-study":"Case study", pricing:"Giá & model", launch:"Ra mắt", news:"Tin" };
const $ = (id) => document.getElementById(id);
const root = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : dark.matches;
const paintTheme = () => { $("theme").textContent = isDark() ? "☀️" : "🌙"; };
try { const t = localStorage.getItem("theme"); if (t) root.dataset.theme = t; } catch {}
$("theme").onclick = () => {
  root.dataset.theme = isDark() ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch {}
  paintTheme();
};
dark.addEventListener("change", paintTheme);
paintTheme();
let all = [], cat = "all", day = decodeURIComponent(location.hash.slice(1)) || "";
const VN = { timeZone: "Asia/Ho_Chi_Minh" };
// An issue = articles PUBLISHED that day (VN time). shortcut: old-dated items (e.g. hackathons found weeks later) sit on their publish day, find them under "Tất cả".
const dayOf = (iso) => new Date(iso).toLocaleDateString("sv-SE", VN);
// Light categories stay out of a day's "Tất cả" list; they have their own tabs.
const LIGHT = new Set(["opensource", "build-in-public"]);
let saved = new Set();
try { saved = new Set(JSON.parse(localStorage.getItem("saved") || "[]")); } catch {}
const WD = ["CN", "T2", "T3", "T4", "T5", "T6", "T7"];

const fmtDate = (iso) => new Date(iso).toLocaleDateString("vi-VN", { day:"2-digit", month:"2-digit" });

function render() {
  const q = $("q").value.trim().toLowerCase();
  const kind = $("kind").value;
  const match = (a) => (!kind || a.kind === kind) && (!q || (a.title + " " + a.summary + " " + a.source).toLowerCase().includes(q));
  const perDay = {};
  all.filter(a => match(a) && !LIGHT.has(a.category)).forEach(a => perDay[a.day] = (perDay[a.day] || 0) + 1);
  const dayKeys = [...new Set(all.map(a => a.day))].sort().reverse();
  if (day !== "all" && !dayKeys.includes(day)) day = dayKeys[0] || "all";
  $("days").replaceChildren(...["all", ...dayKeys].map(k => {
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", String(k === day));
    const top = document.createElement("b"), sub = document.createElement("span");
    if (k === "all") { top.textContent = "Tất cả"; sub.textContent = all.filter(match).length; }
    else { top.textContent = k.slice(8) + "/" + k.slice(5, 7); sub.textContent = WD[new Date(k + "T00:00:00Z").getUTCDay()] + " · " + (perDay[k] || 0); }
    b.append(top, sub);
    b.onclick = () => { day = k; location.hash = k; render(); };
    return b;
  }));

  const dayView = day !== "all";

  // Hackathon posts are often published weeks before we find them, so that tab ignores the day.
  const inDay = all.filter(a => (day === "all" || a.day === day) && match(a));
  const hack = all.filter(a => a.category === "hackathons" && match(a));
  const daily = inDay.filter(a => !(dayView && LIGHT.has(a.category)));
  const savedList = all.filter(a => saved.has(a.url) && match(a));
  const counts = { all: daily.length, hackathons: hack.length, saved: savedList.length };
  inDay.forEach(a => { if (a.category !== "hackathons" && a.category !== "saved") counts[a.category] = (counts[a.category] || 0) + 1; });

  $("tabs").replaceChildren(...Object.keys(LABELS).map(k => {
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", String(k === cat));
    b.textContent = LABELS[k];
    const n = document.createElement("small"); n.textContent = counts[k] || 0; b.append(n);
    b.onclick = () => { cat = k; render(); };
    return b;
  }));

  $("export").hidden = cat !== "saved";
  let shown = cat === "saved" ? savedList : cat === "hackathons" ? hack : cat === "all" ? daily : inDay.filter(a => a.category === cat);
  const byDate = (x, y) => y.published_at.localeCompare(x.published_at);
  if ($("sort").value === "sig") shown.sort((x, y) => y.significance - x.significance || byDate(x, y));
  else shown.sort(byDate);

  // Top 5 of the day: highest significance, at most 2 per category so one topic cannot take the whole block.
  let top = [];
  if (dayView && cat === "all" && !q) {
    const n = {};
    for (const a of [...shown].sort((x, y) => y.significance - x.significance || byDate(x, y))) {
      if (top.length < 5 && (n[a.category] || 0) < 2) { top.push(a); n[a.category] = (n[a.category] || 0) + 1; }
    }
    shown = shown.filter(a => !top.includes(a));
  }
  $("top").hidden = !top.length;
  $("topList").replaceChildren(...top.map(card));
  $("list").replaceChildren(...shown.map(card));
  $("status").textContent = shown.length + top.length ? `${shown.length + top.length} bài` : "Không có bài nào.";
}

function card(a) {
  const el = document.createElement("article");
  const link = document.createElement("a");
  link.href = a.url; link.target = "_blank"; link.rel = "noopener noreferrer"; link.textContent = a.title;
  const meta = document.createElement("div"); meta.className = "meta";
  meta.textContent = `${a.source} · ${fmtDate(a.published_at)} · ${LABELS[a.category] || a.category} · ${a.significance}/5 `;
  if (a.significance >= 5) { const s = document.createElement("span"); s.className = "star"; s.textContent = "★ nên đọc"; meta.append(s); }
  const sv = document.createElement("button"); sv.type = "button"; sv.className = "save";
  const paint = () => { sv.setAttribute("aria-pressed", String(saved.has(a.url))); sv.textContent = saved.has(a.url) ? "★ Đã lưu" : "☆ Lưu"; };
  paint();
  sv.onclick = () => { saved.has(a.url) ? saved.delete(a.url) : saved.add(a.url); try { localStorage.setItem("saved", JSON.stringify([...saved])); } catch {} render(); };
  meta.append(sv);
  const p = document.createElement("p"); p.textContent = a.summary;
  el.append(link, meta, p);
  if (a.action) { const t = document.createElement("p"); t.className = "act"; t.textContent = "→ " + a.action; el.append(t); }
  return el;
}

fetch("data.json").then(r => r.json()).then(d => {
  if (d.telegram) { $("sub").href = d.telegram; $("sub").hidden = false; }
  all = d.articles.map(a => ({ ...a, day: dayOf(a.published_at) }));
  $("status").textContent = "";
  render();
  document.title = "Tech News · cập nhật " + new Date(d.generated).toLocaleString("vi-VN");
}).catch(() => { $("status").textContent = "Không tải được dữ liệu."; });
$("export").onclick = () => {
  const md = "# Đọc sau\n\n" + all.filter(a => saved.has(a.url)).map(a => `- [${a.title}](${a.url}) — ${a.source}\n  ${a.summary}` + (a.action ? `\n  → ${a.action}` : "")).join("\n");
  const l = document.createElement("a"); l.href = URL.createObjectURL(new Blob([md], { type: "text/markdown" })); l.download = "doc-sau.md"; l.click();
};
["q", "sort", "kind"].forEach(id => $(id).addEventListener("input", render));
</script>
</body>
</html>
