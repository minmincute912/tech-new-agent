name: daily
on:
  schedule:
    # Odd minutes: GitHub delays/drops schedules at :00 and :30. UTC times = 07:17 and 18:47 Asia/Ho_Chi_Minh.
    - cron: "17 0 * * *"
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: news

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # not the PyPI package of the same name (a different project)
      - run: pip install -c <(curl -fsSL https://raw.githubusercontent.com/Panniantong/Agent-Reach/main/constraints.txt) git+https://github.com/Panniantong/Agent-Reach
      - name: Fetch, classify, store
        run: python -m tech_news run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}  # GitHub search: 60/h anonymous, 1000/h with token
      - name: Commit data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F)" && git push)
      - run: python -m tech_news build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=tech-news
