name: daily
on:
  schedule:
    # Odd minutes: GitHub delays/drops schedules at :00 and :30. UTC times = 07:17 and 18:47 Asia/Ho_Chi_Minh.
    - cron: "17 0 * * *"
    - cron: "47 11 * * *"
  workflow_dispatch:
    inputs:
      draft:
        description: Also post the weekly editorial now
        type: boolean
        default: false

permissions:
  contents: write

concurrency: news

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # not the PyPI package of the same name (a different project)
      - run: pip install -c <(curl -fsSL https://raw.githubusercontent.com/Panniantong/Agent-Reach/main/constraints.txt) git+https://github.com/Panniantong/Agent-Reach
      - name: Fetch, classify, store
        run: python -m tech_news run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}  # GitHub search: 60/h anonymous, 1000/h with token
      # Once per day: the evening schedule, or a manual run (notify skips a day already sent).
      - name: Send Telegram digest
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 11 * * *'
        continue-on-error: true
        run: python -m tech_news notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Sundays, evening run: weekly editorial post to the channel.
      - name: Weekly post ideas
        if: github.event.schedule == '47 11 * * *'
        continue-on-error: true
        run: if [ "$(date -u +%u)" = 7 ]; then python -m tech_news draft; fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Post ideas (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.draft
        continue-on-error: true
        run: python -m tech_news draft
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit data
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F)" && git pull --rebase -X theirs && git push)
      - run: python -m tech_news build
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}  # only to show the Subscribe button
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=tech-news
      # Private DM to the owner (not the public channel) when any step above failed.
      - name: Alert on failure
        if: failure()
        continue-on-error: true
        run: |
          curl -s "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${ALERT_CHAT_ID}" \
            --data-urlencode "text=⚠️ Tech News: workflow lỗi. ${RUN_URL}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
